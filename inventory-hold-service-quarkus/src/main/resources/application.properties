# Application Configuration
quarkus.application.name=inventory-hold-service-quarkus
quarkus.http.port=8080

# H2 Database Configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./holds-db;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM Configuration
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Python Backend Integration (BookingSystemBackend REST Client)
quarkus.rest-client.booking-system-backend.url=${BOOKING_BACKEND_URL:http://localhost:8001}
quarkus.rest-client.booking-system-backend.scope=jakarta.inject.Singleton

# Hold Configuration
hold.duration.minutes=15
hold.expiration.check.interval.seconds=60s

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.galaxium.holdservice".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} - %m%n

# Jackson Configuration
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.timezone=UTC