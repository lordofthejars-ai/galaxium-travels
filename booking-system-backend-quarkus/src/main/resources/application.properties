# Galaxium Booking System Backend - Quarkus Configuration

# Application Info
quarkus.application.name=Galaxium Booking System Backend

# HTTP Configuration
quarkus.http.port=8001
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,location
quarkus.http.cors.exposed-headers=location


# Database Configuration (H2 in-memory)
quarkus.datasource.db-kind=h2
#quarkus.datasource.jdbc.url=jdbc:h2:mem:galaxium_booking;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Hibernate Configuration
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.jdbc.statement-batch-size=20

# Logging Configuration
quarkus.log.category."com.galaxium".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Health Check Configuration
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

# REST Configuration
#quarkus.rest.path=/api
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.write-dates-as-timestamps=false

# MCP Configuration (custom properties for future implementation)
mcp.enabled=true
mcp.path=/mcp

# Java Hold Service REST Client Configuration
quarkus.rest-client.hold-service.url=${JAVA_SERVICE_URL:http://localhost:8080}
quarkus.rest-client.hold-service.connect-timeout=5000
quarkus.rest-client.hold-service.read-timeout=30000

# Incidence Manager REST Client Configuration
quarkus.rest-client.incidence-manager.url=${INCIDENCE_MANAGER_URL:http://localhost:8888}
quarkus.rest-client.incidence-manager.connect-timeout=5000
quarkus.rest-client.incidence-manager.read-timeout=30000

#quarkus.rest-client.logging.scope=request-response
#quarkus.rest-client.logging.body-limit=1000

quarkus.container-image.group=lordofthejars
quarkus.container-image.registry=quay.io


#quarkus.rest-client.logging.scope=request-response
# LangChain4j Configuration
# OpenAI API Configuration

quarkus.langchain4j.openai.base-url = http://langchain4j.dev/demo/openai/v1
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:demo}
quarkus.langchain4j.openai.timeout=PT60S

quarkus.langchain4j.mcp.time.transport-type=streamable-http
quarkus.langchain4j.mcp.time.url=http://localhost:9999/mcp


quarkus.log.category.*.min-level=inherit
