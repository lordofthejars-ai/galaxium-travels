quarkus.http.port=8005
# Notification router configuration
notification.kafka.topic=notifications
notification.telegram.authorizationtoken=TELEGRAM_ID


camel.component.kafka.brokers=${kafka.bootstrap.servers}

# Outgoing channel for NotificationResource -> Kafka
mp.messaging.outgoing.notifications-out.connector=smallrye-kafka
mp.messaging.outgoing.notifications-out.topic=${notification.kafka.topic}
mp.messaging.outgoing.notifications-out.message.timestamp.type=LogAppendTime

# Passenger service REST client
quarkus.rest-client.passenger-service.url=http://localhost:8001

# Flight service REST client
quarkus.rest-client.flight-service.url=http://localhost:8001

# OIDC / Keycloak — auth-server-url only needed in prod; Dev Services handles dev & test
%prod.quarkus.oidc.auth-server-url=http://localhost:8080/realms/notification-manager
quarkus.oidc.application-type=service
quarkus.oidc.client-id=notification-manager

# DevServices Keycloak — auto-starts a Keycloak container in dev/test
quarkus.keycloak.devservices.realm-name=notification-manager
quarkus.keycloak.devservices.create-realm=true
quarkus.keycloak.devservices.users."alice"=alice
quarkus.keycloak.devservices.roles."alice"=admin
quarkus.keycloak.devservices.users."bob"=bob
quarkus.keycloak.devservices.roles."bob"=user
# Enable Resource Owner Password Credentials (direct access grant) on the dev client
quarkus.keycloak.devservices.grant.type=password
quarkus.oidc.devui.grant.type=password

quarkus.quinoa.package-manager-install.node-version=20.10.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=quinoa